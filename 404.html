<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <title>Pagina non trovata | miniutti.it</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --carbon:#121212; --carbon-deep:#0d0d0d; --golden:#c9a74c; --anthracite:#b3b3b3; --white:#fff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; grid-template-rows:auto 1fr auto; background:var(--carbon); color:var(--white); font-family:'Outfit',sans-serif; }
    header { display:flex; justify-content:space-between; align-items:center; padding:1.15rem 2rem; background:rgba(255,255,255,.05); box-shadow:0 2px 25px rgba(0,0,0,.65); }
    .logo { height:42px; display:block; }
    nav a { margin-left:2rem; color:var(--white); font-weight:600; text-decoration:none; }
    nav a:hover { color:var(--golden); }
    main { display:grid; place-items:center; padding:3rem 1.25rem; }
    .error-box { width:min(100%,700px); padding:3rem; background:var(--carbon-deep); border-radius:20px; box-shadow:0 10px 50px rgba(0,0,0,.4); text-align:center; }
    .error-code { color:var(--golden); font-size:clamp(5rem,18vw,10rem); font-weight:700; line-height:1; }
    .error-message { margin:1rem 0 2rem; color:var(--anthracite); font-size:1.15rem; }
    .home-link { display:inline-block; padding:.85rem 1.6rem; background:linear-gradient(90deg,#008c45,#f4f5f0,#cd212a); border-radius:50px; color:var(--carbon); font-weight:700; text-decoration:none; }
    footer { padding:2rem; background:var(--carbon-deep); color:var(--anthracite); text-align:center; }
  </style>
</head>
<body>
  <header>
    <a href="index.html"><img src="favicon.png" alt="Logo miniutti.it" class="logo" /></a>
    <nav><a href="index.html">Home</a><a href="index.html#contatti">Contatti</a></nav>
  </header>
  <main>
    <div class="error-box">
      <div class="error-code">404</div>
      <div class="error-message">La pagina che cerchi non esiste più oppure è stata archiviata.</div>
      <a href="index.html" class="home-link">Torna alla Home</a>
    </div>
  </main>
  <footer>© 2026 miniutti.it — Tutti i diritti riservati</footer>
</body>
</html>
