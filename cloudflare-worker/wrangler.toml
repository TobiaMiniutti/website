name = "miniutti-contact"
main = "src/index.js"
compatibility_date = "2026-08-15"
workers_dev = false

routes = [
  { pattern = "miniutti.it/api/contact", zone_name = "miniutti.it" },
  { pattern = "www.miniutti.it/api/contact", zone_name = "miniutti.it" }
]

[vars]
ALLOWED_ORIGINS = "https://miniutti.it,https://www.miniutti.it"
ALLOWED_HOSTNAMES = "miniutti.it,www.miniutti.it"

[[ratelimits]]
name = "CONTACT_EMAIL_RATE_LIMITER"
namespace_id = 43001
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "CONTACT_GLOBAL_RATE_LIMITER"
namespace_id = 43002
simple = { limit = 60, period = 60 }

[secrets]
required = ["TURNSTILE_SECRET_KEY", "MAKE_WEBHOOK_URL"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
