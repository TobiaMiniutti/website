name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "content/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked toolchain
        run: npm ci --ignore-scripts

      - name: Generate project pages
        run: npm run generate:projects

      - name: Test source and worker
        run: npm test

      - name: Build production artifact

        env:
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          MOBILE_PHONE_DISPLAY: ${{ vars.MOBILE_PHONE_DISPLAY }}
          MOBILE_PHONE_TEL: ${{ vars.MOBILE_PHONE_TEL }}
        run: npm run build:production

      - name: Publish BIMI logo
        run: |
          install -D -m 0644 \
            public/.well-known/bimi/logo.svg \
            dist/.well-known/bimi/logo.svg

      - name: Verify BIMI logo
        run: test -f dist/.well-known/bimi/logo.svg

      - name: Validate finished artifact
        run: npm run validate:dist

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@v5
